  <details class="static-gallery"><summary>Static view and diagnostic meaning</summary><p>Moving the candidate samples a different part of the same reference-weighted PDZ. Increasing the competing environmental enhancement changes the external integral but leaves the photometry and both normalized redshift distributions unchanged. The displayed allocation is conditional on this chosen state, not averaged over any posterior.</p><a href="../assets/cluster/pdz-response.svg"><img src="../assets/cluster/pdz-response.svg" alt="Three line styles distinguish source PDZ, reference-weighted response and enhanced external integrand." width="940" height="550" loading="lazy"></a></details>
  <figcaption><strong>Remove the source prior, apply one reference, then evaluate competing intensities.</strong> This teaching reference is a smoothed redshift histogram of the supplied H &lt; 24 catalogue, normalized to \(\pi_R(z)\); it is not a calibrated survey selection. The source prior is \(\pi_{\rm src}(z)\propto(1+z)^{-1}\), so \(q_i\propto p_i^{\rm src}(z)(1+z)\pi_R(z)\), normalized on 0 &lt; z &lt; 3.2. Set \(\rho_R=\Sigma_R\pi_R\), \(\lambda U_i/\Sigma_R=0.15\), and \(HF=1+A\exp[-(z-0.739677)^2/(2\times0.018^2)]\). Then \(a_i^P=0.15q_i(z_*)/\pi_R(z_*)\) and \(a_i^E=\int q_iHF\,dz\). All integrals use the full support, even when the plot is zoomed. The vertical line marks the trial candidate redshift. The synthetic PDZ examples use real mock rows; no displayed allocation is a catalogue fit.</figcaption>
